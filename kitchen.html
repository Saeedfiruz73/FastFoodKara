<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="8"><title>KARA Kitchen Display</title><style>
:root{--bg:#0b0b0c;--panel:#18181a;--gold:#d8b56b;--cream:#fff0cf;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:15px Arial,Tahoma,sans-serif}.top{padding:16px 22px;border-bottom:1px solid #39342b;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;color:var(--gold);letter-spacing:3px}a{color:var(--gold)}main{max-width:1400px;margin:auto;padding:22px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--panel);border:1px solid #39342b;border-radius:13px;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #39342b;padding-bottom:10px}.id{font-size:22px;color:var(--gold);font-weight:bold}.meta{font-size:12px;color:var(--muted)}ul{padding-left:20px;line-height:2}.btn{border:0;border-radius:7px;padding:10px 12px;margin:4px 4px 0 0;background:var(--gold);color:#17120a;font-weight:bold;cursor:pointer}.done{background:#335b42;color:white}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed #55472e;border-radius:14px}.stats{color:var(--muted);font-size:13px}@media(max-width:850px){.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.board{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand">KARA <small style="font-size:10px;color:#aaa">KITCHEN DISPLAY</small></div><div><a href="pos.html">← POS / Cashier</a>　<button class="btn" onclick="loadOrders()">Refresh</button></div></header><main><h2>Kitchen order queue</h2><p class="stats" id="stats">Orders waiting: 0</p><div class="board" id="board"></div></main><script>
function loadOrders(){let orders=JSON.parse(localStorage.getItem('kara_demo_orders')||'[]');let active=orders.filter(o=>o.status!=='Completed');document.getElementById('stats').textContent='Orders waiting: '+active.length+' • Demo queue';document.getElementById('board').innerHTML=active.length?active.map(o=>'<article class="card"><div class="head"><span class="id">'+o.id+'</span><span class="meta">'+o.created+'</span></div><p><b>'+o.type+'</b> '+(o.customer?'• '+o.customer:'')+'</p><ul>'+o.items.map(i=>'<li>'+i.name+'</li>').join('')+'</ul><div class="head"><b style="color:var(--gold)">'+o.total.toFixed(3)+' OMR</b><span class="meta">'+o.status+'</span></div><button class="btn" onclick="setStatus(\''+o.id+'\',\'Preparing\')">Preparing</button><button class="btn done" onclick="setStatus(\''+o.id+'\',\'Completed\')">Completed</button></article>').join(''):'<div class="empty">No active orders yet.<br>Place a test order from the POS page.</div>'}
function setStatus(id,status){let orders=JSON.parse(localStorage.getItem('kara_demo_orders')||'[]');let o=orders.find(x=>x.id===id);if(o){o.status=status;localStorage.setItem('kara_demo_orders',JSON.stringify(orders));loadOrders()}}loadOrders();setInterval(loadOrders,4000);
</script></body></html>
