<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARA POS</title><style>
:root{--bg:#0b0b0c;--panel:#18181a;--gold:#d8b56b;--cream:#fff0cf;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:15px Arial,Tahoma,sans-serif}.top{padding:16px 22px;border-bottom:1px solid #39342b;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;color:var(--gold);letter-spacing:3px}.top a{color:var(--gold)}main{max-width:1200px;margin:auto;padding:22px;display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.panel{background:var(--panel);border:1px solid #39342b;border-radius:14px;padding:18px}h2{margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{background:#242426;border:1px solid #39342b;border-radius:10px;padding:13px;text-align:left;color:var(--cream);cursor:pointer}.item b{display:block}.item span{color:var(--gold)}.line{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #39342b;padding:10px 0}.btn{width:100%;border:0;border-radius:8px;background:var(--gold);color:#15110a;padding:12px;font-weight:bold;cursor:pointer;margin-top:12px}.muted{color:var(--muted);font-size:13px}input,select{background:#242426;color:var(--cream);border:1px solid #494238;border-radius:7px;padding:10px;width:100%;margin:6px 0 12px}.total{display:flex;justify-content:space-between;color:var(--gold);font-size:20px;font-weight:bold;padding-top:14px}@media(max-width:760px){main{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><div class="brand">KARA <small style="font-size:10px;color:#aaa">POS / CASHIER</small></div><a href="kitchen.html">Kitchen Display →</a></header><main><section class="panel"><h2>New order</h2><p class="muted">Select products to add them to the current ticket.</p><div class="grid" id="menu"></div></section><section class="panel"><h2>Current ticket</h2><label class="muted">Order type</label><select id="type"><option>Dine in</option><option>Takeaway</option><option>Delivery</option></select><label class="muted">Customer / table (optional)</label><input id="customer" placeholder="Name, table or phone"><div id="ticket"><p class="muted">No items selected.</p></div><div class="total"><span>Total</span><span id="total">0.000 OMR</span></div><button class="btn" onclick="placeOrder()">Send to kitchen</button><p class="muted">Prototype mode: orders sync only between tabs on this same browser/device. Networked POS/KDS needs a backend.</p></section></main><script>
const menu=[['French Fries',.800],['Fries + Alfredo',1.600],['Fries + Crispy Chicken',1.700],['Caesar Salad',2.500],['Chicken Alfredo',2.800],['Special Mix Pasta',3],['Oven Roasted Ham',1.900],['Kara Special',1.900],['Chicken Panini',2.200],['Beef Pizza',1.500],['Chicken Pizza (Economy)',1.500],['Peperoni Pizza',1.800],['Garlic Steak Pizza S',2.600],['Garlic Steak Pizza M',3.300],['Garlic Steak Pizza L',4.900],['French Burger',2.800],['Double French Burger',3.200],['American Burger',2.100],['Caramel Burger',1.800],['Classic Burger',1.400],['Double Cheese Burger',2.400],['Cheese Burger',1.600],['Fried Chicken 4 pcs',1.900],['Fried Chicken 8 pcs',2.900],['Zinger Sandwich',1.600]];
let ticket=[];const fmt=n=>n.toFixed(3)+' OMR';document.getElementById('menu').innerHTML=menu.map((p,i)=>'<button class="item" onclick="add('+i+')"><b>'+p[0]+'</b><span>'+fmt(p[1])+'</span></button>').join('');
function add(i){ticket.push(menu[i]);draw()}function draw(){document.getElementById('ticket').innerHTML=ticket.length?ticket.map((p,i)=>'<div class="line"><span>'+p[0]+'</span><span>'+fmt(p[1])+' <button onclick="removeItem('+i+')" style="background:none;border:0;color:#e99">×</button></span></div>').join(''):'<p class="muted">No items selected.</p>';document.getElementById('total').textContent=fmt(ticket.reduce((s,p)=>s+p[1],0))}
function removeItem(i){ticket.splice(i,1);draw()}function placeOrder(){if(!ticket.length){alert('Add at least one item.');return}let orders=JSON.parse(localStorage.getItem('kara_demo_orders')||'[]');let order={id:'K'+Date.now().toString().slice(-6),items:ticket.map(p=>({name:p[0],price:p[1]})),total:ticket.reduce((s,p)=>s+p[1],0),type:document.getElementById('type').value,customer:document.getElementById('customer').value,status:'New',created:new Date().toLocaleTimeString()};orders.unshift(order);localStorage.setItem('kara_demo_orders',JSON.stringify(orders));ticket=[];draw();document.getElementById('customer').value='';alert('Order '+order.id+' added to demo kitchen queue. Open Kitchen Display in this browser.')}
</script></body></html>
